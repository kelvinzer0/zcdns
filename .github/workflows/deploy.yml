name: Deploy ZCDNS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Frontend
        run: |
          bun install
          bun run build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build OpenWebUI Frontend
        run: |
          mkdir -p dist/openwebui
          echo "==> Cloning OpenWebUI source (stable tag v0.11.4)..."
          git clone --depth 1 --branch v0.11.4 https://github.com/open-webui/open-webui.git /tmp/open-webui
          
          echo "==> Applying custom patches..."
          chmod +x scripts/patch_openwebui.sh
          ./scripts/patch_openwebui.sh /tmp/open-webui
          
          echo "==> Installing dependencies and building OpenWebUI frontend..."
          cd /tmp/open-webui
          npm install --force
          NODE_OPTIONS="--max-old-space-size=8192" npm run build || true
          
          cd "$GITHUB_WORKSPACE"
          if [ -d "/tmp/open-webui/build" ] && [ -f "/tmp/open-webui/build/index.html" ]; then
            echo "==> Custom OpenWebUI build succeeded!"
            cp -r /tmp/open-webui/build/* dist/openwebui/
          else
            echo "==> Build fallback to wheel package..."
            curl -sL -o /tmp/open_webui.whl https://files.pythonhosted.org/packages/ca/8d/051d8145b88cb3f97f9e165feaa4a266aa46f4f5f2df67affb0e72ba8066/open_webui-0.11.4-py3-none-any.whl
            unzip -q /tmp/open_webui.whl "open_webui/frontend/*" -d /tmp/owu
            cp -r /tmp/owu/open_webui/frontend/* dist/openwebui/
            rm -rf /tmp/open_webui.whl /tmp/owu
          fi
          rm -rf /tmp/open-webui

      - name: Build Go Backend
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o zcdns-server .

      - name: Build ZVault CLI Binaries
        run: |
          cd zvault-cli
          mkdir -p ../dist/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/bin/zvault-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/bin/zvault-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm go build -ldflags="-s -w" -o ../dist/bin/zvault-linux-arm .
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/bin/zvault-android-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/bin/zvault-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/bin/zvault-macos-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/bin/zvault-macos-arm64 .

      - name: Publish ZVault Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create zvault-latest dist/bin/* --title "zvault CLI (Latest)" --notes "Cross-platform zvault binary release for Linux, macOS, Windows, and Android (Termux)." || \
          gh release upload zvault-latest dist/bin/* --clobber || true

      - name: Setup IPv6 with WireGuard and Cloudflare WARP
        env:
          WGCF_CONF: ${{ secrets.WGCF_CONF }}
          WGCF_PRIVATE_KEY: ${{ secrets.WGCF_PRIVATE_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard-tools resolvconf iproute2 curl

          # Build and install wireguard-go from official repository
          git clone --depth 1 https://github.com/WireGuard/wireguard-go.git /tmp/wireguard-go
          cd /tmp/wireguard-go
          go build -ldflags="-s -w" -o /tmp/wireguard-go/wireguard-go .
          sudo mv /tmp/wireguard-go/wireguard-go /usr/local/bin/wireguard-go
          cd "$GITHUB_WORKSPACE"

          # Setup WARP WireGuard configuration for IPv6 from Secret
          sudo mkdir -p /etc/wireguard
          if [ -n "$WGCF_CONF" ]; then
            printf "%s\n" "$WGCF_CONF" | sudo tee /etc/wireguard/warp.conf > /dev/null
          else
            sudo tee /etc/wireguard/warp.conf > /dev/null << EOF
          [Interface]
          PrivateKey = $WGCF_PRIVATE_KEY
          Address = 172.16.0.2/32
          Address = fd01:5ca1:ab1e:823e:e094:eb1c:ff87:1fab/128
          MTU = 1280

          [Peer]
          PublicKey = bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
          AllowedIPs = ::/0
          Endpoint = engage.cloudflareclient.com:2408
          EOF
          fi
          sudo sed -i 's/^[ \t]*//' /etc/wireguard/warp.conf
          sudo chmod 600 /etc/wireguard/warp.conf

          # Start WireGuard using wireguard-go
          export WG_I_PREFER_BUGGY_USERSPACE_TO_NO_KERNEL_SUPPORT=1
          sudo -E wg-quick up warp

          # Verify IPv6 connectivity
          ip -6 a
          ping6 -c 3 2606:4700:4700::1111 || true
          curl -6 -sI https://cloudflare.com | head -n 3 || true

      - name: Deploy to Remote Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          export SSHPASS="$SSH_PASSWORD"
          
          # Ensure remote directory exists
          sshpass -e ssh -6 -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "mkdir -p /opt/zcdns/dist"

          # Upload backend binary
          sshpass -e scp -6 -o StrictHostKeyChecking=no backend/zcdns-server ${SSH_USER}@[${SSH_HOST}]:/opt/zcdns/zcdns-server.new
          
          # Upload frontend dist via compressed stream
          tar -czf - -C dist . | sshpass -e ssh -6 -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "tar -xzf - -C /opt/zcdns/dist"

          # Replace binary, configure firewall for DNS (UDP & TCP 53), configure shared-ip, and restart services
          sshpass -e ssh -6 -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "
            mv -f /opt/zcdns/zcdns-server.new /opt/zcdns/zcdns-server &&
            chmod +x /opt/zcdns/zcdns-server &&
            (which ufw >/dev/null 2>&1 && (ufw allow 53/tcp; ufw allow 53/udp; ufw allow 853/tcp) || true) &&
            (which ip6tables >/dev/null 2>&1 && (ip6tables -I INPUT -p tcp --dport 53 -j ACCEPT; ip6tables -I INPUT -p udp --dport 53 -j ACCEPT; ip6tables -I INPUT -p tcp --dport 853 -j ACCEPT) || true) &&
            (which iptables >/dev/null 2>&1 && (iptables -I INPUT -p tcp --dport 53 -j ACCEPT; iptables -I INPUT -p udp --dport 53 -j ACCEPT; iptables -I INPUT -p tcp --dport 853 -j ACCEPT) || true) &&
            # Configure shared-ip DNS mappings so port 53 traffic for zcdns.id routes to zcdns-server
            shared-ip add zcdns.id --localport=53 --localipv4=10.0.0.10 --localipv6=fd00::10 || shared-ip update zcdns.id --localport=53 --localipv4=10.0.0.10 --localipv6=fd00::10 || true &&
            shared-ip add ns2.zcdns.id --localport=53 --localipv4=10.0.0.11 --localipv6=fd00::11 || true &&
            # Configure shared-ip DoT mapping so port 853 traffic for guard.zcdns.id routes to zcdns-server
            shared-ip add guard.zcdns.id --localport=853 --localipv4=10.0.0.10 --localipv6=fd00::10 || shared-ip update guard.zcdns.id --localport=853 --localipv4=10.0.0.10 --localipv6=fd00::10 || true &&
            shared-ip add "*.guard.zcdns.id" --localport=853 --localipv4=10.0.0.10 --localipv6=fd00::10 || shared-ip update "*.guard.zcdns.id" --localport=853 --localipv4=10.0.0.10 --localipv6=fd00::10 || true &&

            # Configure shared-ip HTTPS mapping for AI Router proxy (points to Nginx on 10.0.0.12 / fd00::12)
            shared-ip update router.zcdns.id --localport=443 --localipv4=10.0.0.12 --localipv6=fd00::12 2>/dev/null || shared-ip add router.zcdns.id --localport=443 --localipv4=10.0.0.12 --localipv6=fd00::12 2>/dev/null || true &&
            shared-ip update "*.router.zcdns.id" --localport=443 --localipv4=10.0.0.12 --localipv6=fd00::12 2>/dev/null || shared-ip add "*.router.zcdns.id" --localport=443 --localipv4=10.0.0.12 --localipv6=fd00::12 2>/dev/null || true &&
            systemctl restart zcdns &&
            systemctl is-active zcdns &&
            systemctl restart shared-ip &&
            systemctl is-active shared-ip &&
            ss -tulpn | grep -E '53|853' || true
          "

      - name: Setup Router SSL (Certbot + Nginx)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          export SSHPASS="$SSH_PASSWORD"
          # Upload the setup script (avoids heredoc-in-SSH syntax errors)
          sshpass -e scp -6 -o StrictHostKeyChecking=no .github/scripts/setup-router-ssl.sh ${SSH_USER}@[${SSH_HOST}]:/opt/zcdns/setup-router-ssl.sh
          # Execute it
          sshpass -e ssh -6 -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "chmod +x /opt/zcdns/setup-router-ssl.sh && /opt/zcdns/setup-router-ssl.sh"


      - name: Verify and Test Remote DNS and AXFR
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          export SSHPASS="$SSH_PASSWORD"
          echo "=== 1. DIAGNOSTICS ON REMOTE SERVER ==="
          sshpass -e ssh -6 -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "
            echo '--- SHARED-IP LIST ---'
            shared-ip list || true
            echo '--- SHARED-IP SHOW 443 ---'
            shared-ip show zcdns.id --localport=443 || true
            shared-ip show router.zcdns.id --localport=443 || true
            shared-ip show '*.router.zcdns.id' --localport=443 || true
            echo '--- IP ADDRESSES ---'
            ip -br a || true
            echo '--- LISTENING PORTS (443 / 8085) ---'
            ss -tulpn | grep -E '443|8085' || true
            echo '--- NGINX SITES ENABLED ---'
            ls -la /etc/nginx/sites-enabled/ || true
            echo '--- TEST NGINX LOCALHOST (router.zcdns.id) ---'
            curl -k -v --resolve router.zcdns.id:443:127.0.0.1 https://router.zcdns.id/v1/chat/completions 2>&1 | head -25 || true
            echo '--- NGINX ERROR LOG ---'
            tail -n 20 /var/log/nginx/error.log || true
          "
          echo "=== 2. TEST FROM RUNNER OVER EXTERNAL IPV6 ==="
          sudo apt-get install -y dnsutils
          echo "--- DIG SOA UDP OVER IPV6 ---"
          dig -6 @${SSH_HOST} zcdns.id SOA +time=3 +tries=2 || true
          echo "--- DIG SOA TCP OVER IPV6 ---"
          dig -6 @${SSH_HOST} zcdns.id SOA +tcp +time=3 +tries=2 || true
          echo "--- DIG AXFR OVER IPV6 ---"
          dig -6 @${SSH_HOST} zcdns.id AXFR +time=5 +tries=2 || true

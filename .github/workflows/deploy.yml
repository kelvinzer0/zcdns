name: Deploy ZCDNS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Frontend
        run: |
          bun install
          bun run build

      - name: Build Go Backend
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o zcdns-server .

      - name: Setup IPv6 with wgcf and wireguard-go
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard-tools resolvconf iproute2 curl

          # Install wireguard-go
          go install golang.zx2c4.com/wireguard/wireguard-go@latest
          sudo cp $(go env GOPATH)/bin/wireguard-go /usr/local/bin/wireguard-go

          # Download and install wgcf
          curl -fsSL -o /tmp/wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          chmod +x /tmp/wgcf
          sudo mv /tmp/wgcf /usr/local/bin/wgcf

          # Register WARP account and generate profile
          wgcf register --accept-tos
          wgcf generate

          # Preserve runner DNS and only route IPv6 over WireGuard
          sed -i '/^DNS =/d' wgcf-profile.conf
          sed -i 's/AllowedIPs = 0.0.0.0\/0, ::\/0/AllowedIPs = ::\/0/g' wgcf-profile.conf

          # Start WireGuard using wireguard-go
          sudo mkdir -p /etc/wireguard
          sudo cp wgcf-profile.conf /etc/wireguard/wgcf.conf
          export WG_I_PREFER_BUGGY_USERSPACE_TO_NO_KERNEL_SUPPORT=1
          sudo -E wg-quick up wgcf

          # Verify IPv6 connectivity
          ip -6 a
          curl -6 -sI https://cloudflare.com | head -n 3 || true

      - name: Deploy to Remote Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          export SSHPASS="$SSH_PASSWORD"
          
          # Ensure remote directory exists
          sshpass -e ssh -6 -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "mkdir -p /opt/zcdns/dist"

          # Upload backend binary
          sshpass -e scp -6 -o StrictHostKeyChecking=no backend/zcdns-server ${SSH_USER}@[${SSH_HOST}]:/opt/zcdns/zcdns-server.new
          
          # Upload frontend dist via compressed stream
          tar -czf - -C dist . | sshpass -e ssh -6 -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "tar -xzf - -C /opt/zcdns/dist"

          # Replace binary, set permissions, and restart service
          sshpass -e ssh -6 -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "mv -f /opt/zcdns/zcdns-server.new /opt/zcdns/zcdns-server && chmod +x /opt/zcdns/zcdns-server && systemctl restart zcdns && systemctl is-active zcdns"
